<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossigeno-Ozono e longevità – Dott. Michele Bonaccorso</title>
<style>
  :root { --navy: #0f3b52; --cyan: #3fb4e5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b1620; color: #fff; font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #stage img.slide { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  #stage video { position: absolute; object-fit: contain; background: #000; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,.55)); opacity: 0; transition: opacity .3s; }
  body:hover .bar, .bar.show { opacity: 1; }
  .bar button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 6px; padding: 9px 16px; font-size: 15px; cursor: pointer; }
  .bar button:hover { background: var(--cyan); }
  .bar span { font-size: 14px; min-width: 64px; text-align: center; }
  .zone { position: fixed; top: 0; bottom: 60px; width: 18%; cursor: pointer; }
  .zone.l { left: 0; } .zone.r { right: 0; }
  #prog { position: fixed; left: 0; top: 0; height: 3px; background: var(--cyan); transition: width .3s; }
</style>
</head>
<body>
<div id="prog"></div>
<div id="wrap"><div id="stage"></div></div>
<div class="zone l" onclick="go(-1)"></div>
<div class="zone r" onclick="go(1)"></div>
<div class="bar" id="bar">
  <button onclick="go(-1)" aria-label="Indietro">&#8592;</button>
  <span id="num">1 / 1</span>
  <button onclick="go(1)" aria-label="Avanti">&#8594;</button>
  <button onclick="fs()">Schermo intero</button>
</div>
<script>
let S = [], i = 0;
const stage = document.getElementById('stage');
function show(n) {
  i = Math.max(0, Math.min(S.length - 1, n));
  stage.querySelectorAll('video').forEach(v => v.pause());
  stage.innerHTML = '';
  const im = new Image(); im.className = 'slide'; im.src = S[i].img; im.alt = 'Slide ' + (i + 1);
  stage.appendChild(im);
  for (const v of S[i].videos) {
    const el = document.createElement('video');
    el.src = v.src; el.poster = v.poster; el.playsInline = true; el.preload = 'auto';
    if (v.auto) { el.muted = true; el.autoplay = true; el.removeAttribute('poster'); el.style.background = 'transparent'; el.style.cursor = 'pointer'; el.onclick = () => { el.currentTime = 0; el.play(); }; }
    else el.controls = true;
    Object.assign(el.style, { left: v.x * 100 + '%', top: v.y * 100 + '%', width: v.w * 100 + '%', height: v.h * 100 + '%' });
    stage.appendChild(el);
  }
  document.getElementById('num').textContent = (i + 1) + ' / ' + S.length;
  document.getElementById('prog').style.width = ((i + 1) / S.length * 100) + '%';
  history.replaceState(null, '', '#' + (i + 1));
  if (S[i + 1]) { const p = new Image(); p.src = S[i + 1].img; }
}
function go(d) { show(i + d); }
function fs() { const d = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : (d.requestFullscreen || d.webkitRequestFullscreen).call(d); }
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === 'f') fs();
});
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); tx = null; });
window.addEventListener('hashchange', () => { const n = (parseInt(location.hash.slice(1)) || 1) - 1; if (n !== i) show(n); });
fetch('slides.json').then(r => r.json()).then(d => { S = d; show((parseInt(location.hash.slice(1)) || 1) - 1); });
</script>
</body>
</html>
