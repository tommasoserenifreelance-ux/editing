.tabs{display:flex;border-top:1px solid #dbdbdb;margin-top:8px}
.tabs div{flex:1;height:46px;display:flex;align-items:center;justify-content:center}
.tabs div.on{border-bottom:1.5px solid #000}
.empty{text-align:center;padding-top:44px}

.empty b{font-size:22px;display:block;margin-bottom:6px}

.bar{position:absolute;bottom:0;left:0;right:0;height:84px;border-top:1px solid #eee;background:#fff;display:flex;justify-content:space-around;padding-top:14px}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#000}
