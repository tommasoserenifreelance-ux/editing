name: Release foto servizio

on:
  push:
    branches: [claude/sweet-knuth-lkz06a]
    paths: [.github/workflows/release-foto.yml, 'public/foto/servizio/**', 'presentazione/**']
  workflow_dispatch:

concurrency:
  group: release-foto
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip all edited photos
        run: |
          cd public/foto/servizio
          ls *.jpg | wc -l
          zip -q -0 ../../../foto-servizio-editate.zip *.jpg
          ls -lh ../../../foto-servizio-editate.zip
      - name: Create release with the zip and every photo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete foto-servizio-editate --yes --cleanup-tag 2>/dev/null || true
          gh release create foto-servizio-editate \
            --target "${GITHUB_SHA}" \
            --title "Foto servizio – editate ($(ls public/foto/servizio/*.jpg | wc -l))" \
            --notes "Foto editate: sfondo pulito con profondità, pelle ritoccata, nero del camice aperto, polvere rimossa. Scarica foto-servizio-editate.zip per averle tutte insieme." \
            foto-servizio-editate.zip presentazione/GLIALTRINFERMIERI.pptx presentazione/GLIALTRINFERMIERI.pdf public/foto/servizio/*.jpg
