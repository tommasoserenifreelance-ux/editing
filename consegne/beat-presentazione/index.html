<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat – Contenuti video</title>
<meta name="description" content="Beat · Pizza, Roll & Spa – i video di novembre 2026">
<style>
  @font-face { font-family: "Space Mono"; font-weight: 400; src: url(fonts/space-mono-latin-400-normal.woff2) format("woff2"); }

  :root {
    --dark: #14110e;
    --cream: #f3ec9c;
    --yellow: #f2b90f;
    --light: #f4efe6;
    --muted: #8f877a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Space Mono", ui-monospace, monospace; -webkit-font-smoothing: antialiased; }

  /* Slides are laid out on a fixed 1920x1080 stage, scaled to fit the window. */
  #viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 1920px; height: 1080px; position: relative; flex: none; transform-origin: center center; background: var(--dark); }
  .slide {
    position: absolute; inset: 0; display: flex; opacity: 0; visibility: hidden;
    transition: opacity .45s ease, visibility .45s;
  }
  .slide.active { opacity: 1; visibility: visible; }
  .logo { position: absolute; top: 64px; right: 128px; width: 150px; }

  /* Cover */
  .cover { padding: 128px; align-items: center; justify-content: space-between; gap: 96px;
    background: radial-gradient(ellipse at 78% 50%, rgba(242,185,15,.22), transparent 60%), var(--dark); }
  .cover .kicker { font-size: 28px; letter-spacing: 6px; color: var(--yellow); margin-bottom: 40px; }
  .cover h1 { font-size: 92px; font-weight: 400; line-height: 1.08; color: var(--light); letter-spacing: -2px; }
  .cover .sub { margin-top: 48px; font-size: 30px; color: var(--muted); }
  .cover .big-logo { width: 520px; flex: none; }

  /* Reels */
  .reel { padding: 128px; align-items: center; gap: 112px; }
  .reel .frame {
    position: relative; width: 463px; height: 824px; flex: none; border: 3px solid var(--yellow);
    border-radius: 28px; overflow: hidden; background: #000; cursor: pointer;
  }
  .reel.wide { flex-direction: column; align-items: flex-start; justify-content: center; gap: 48px; padding: 96px 128px; }
  .reel.wide .frame { width: 1200px; height: 675px; }
  .reel video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reel .play {
    position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px;
    border-radius: 50%; background: rgba(20, 17, 14, .72); border: 3px solid var(--yellow);
    display: flex; align-items: center; justify-content: center; transition: opacity .2s;
  }
  .reel .play::after {
    content: ""; margin-left: 10px; border-style: solid; border-width: 26px 0 26px 44px;
    border-color: transparent transparent transparent var(--yellow);
  }
  .reel .frame.playing .play { opacity: 0; }
  .reel .text { flex: 1; display: flex; flex-direction: column; gap: 36px; }
  .reel .kicker { font-size: 24px; letter-spacing: 4px; color: var(--yellow); }
  .reel h2 { font-size: 66px; font-weight: 400; line-height: 1.12; color: var(--light); margin-top: 16px; letter-spacing: -1px; }
  .reel .desc { font-size: 26px; line-height: 1.5; color: var(--cream); max-width: 760px; }
  .reel .hint { font-size: 22px; color: var(--muted); }
  .reel.wide .text { flex: none; flex-direction: row; align-items: flex-end; gap: 64px; width: 1664px; }
  .reel.wide h2 { font-size: 56px; }
  .reel.wide .desc { max-width: 640px; }

  /* Closing */
  .closing { flex-direction: column; align-items: center; justify-content: center; gap: 56px;
    background: radial-gradient(ellipse at 50% 45%, rgba(242,185,15,.18), transparent 60%), #000; }
  .closing img { width: 460px; }
  .closing p { font-size: 40px; color: var(--cream); letter-spacing: 2px; }

  /* Navigation */
  .nav {
    position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; align-items: center; z-index: 5;
    font: 14px "Space Mono", monospace; color: #fff; transition: opacity .4s;
  }
  .nav button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(20,17,14,.6); color: #fff; font-size: 20px; cursor: pointer;
  }
  .nav button:hover { border-color: var(--yellow); color: var(--yellow); }
  body.idle .nav { opacity: 0; }
  .nav .counter { min-width: 56px; text-align: center; background: rgba(20,17,14,.6); padding: 6px 10px; border-radius: 999px; }
</style>
</head>
<body>
<div id="viewport"><div id="stage">

  <section class="slide cover">
    <div>
      <p class="kicker">CONTENUTI VIDEO · NOVEMBRE 2026</p>
      <h1>Beat<br><span style="white-space:nowrap">Pizza, Roll &amp; Spa</span></h1>
      <p class="sub">4 video per i social · Bagno a Ripoli</p>
    </div>
    <img class="big-logo" src="media/logo-white.png" alt="Logo Beat">
  </section>

  <!-- Reel slides are filled in from REELS below. -->

  <section class="slide closing" id="closing">
    <img src="media/logo-white.png" alt="Logo Beat">
    <p>Grazie</p>
  </section>

</div></div>

<div class="nav">
  <button id="prev" aria-label="Slide precedente">‹</button>
  <span class="counter" id="counter"></span>
  <button id="next" aria-label="Slide successiva">›</button>
</div>

<script>
  const REELS = [
    {
      n: "01", time: "0:10", format: "16:9", wide: true, title: "La comanda",
      desc: "Lo scontrino della comanda sul pass: Gattopardo, Tartare e Uovo perfetto escono dalla cucina e vengono barrati uno a uno.",
    },
    {
      n: "02", time: "0:12", format: "9:16", title: "I sushi d’autore",
      desc: "Divina Commedia, Gattopardo, Promessi Sposi: ogni piatto si ferma come una foto, con nome e ingredienti.",
    },
    {
      n: "03", time: "0:10", format: "9:16", title: "You enjoy / We make",
      desc: "Schermo diviso: sopra il servizio al tavolo con il vino, sotto la cucina che prepara i roll.",
    },
    {
      n: "04", time: "0:37", format: "9:16", title: "Cena di Natale aziendale",
      desc: "Il video parlato per le aziende: buffet, cena servita, menù personalizzabile, parcheggio. Con sottotitoli, icone ed effetti sonori.",
    },
  ];

  const stage = document.getElementById("stage");
  const closing = document.getElementById("closing");

  REELS.forEach((r, i) => {
    const s = document.createElement("section");
    s.className = "slide reel" + (r.wide ? " wide" : "");
    s.innerHTML = `
      <div class="frame">
        <video src="media/video${i + 1}.mp4" poster="media/still${i + 1}.jpg" playsinline preload="metadata"></video>
        <div class="play"></div>
      </div>
      <div class="text">
        <div><p class="kicker">VIDEO ${r.n} · ${r.time} · ${r.format}</p><h2>${r.title}</h2></div>
        <p class="desc">${r.desc}</p>
        ${r.wide ? "" : '<p class="hint">Clicca sul video per avviarlo</p>'}
      </div>
      ${r.wide ? "" : '<img class="logo" src="media/logo-white.png" alt="Logo Beat">'}`;
    stage.insertBefore(s, closing);
  });

  const slides = [...document.querySelectorAll(".slide")];
  let current = 0;

  const show = (i) => {
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle("active", k === current));
    document.querySelectorAll("video").forEach((v) => v.pause());
    document.getElementById("counter").textContent = `${current + 1} / ${slides.length}`;
    history.replaceState(null, "", `#${current + 1}`);
  };

  // Click a video to play or pause it, with sound.
  document.querySelectorAll(".reel .frame").forEach((frame) => {
    const video = frame.querySelector("video");
    frame.addEventListener("click", () => (video.paused ? video.play() : video.pause()));
    video.addEventListener("play", () => frame.classList.add("playing"));
    video.addEventListener("pause", () => frame.classList.remove("playing"));
    video.addEventListener("ended", () => { video.currentTime = 0; });
  });

  document.getElementById("prev").addEventListener("click", () => show(current - 1));
  document.getElementById("next").addEventListener("click", () => show(current + 1));
  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); show(current + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(current - 1); }
    if (e.key === " ") {
      e.preventDefault();
      const v = slides[current].querySelector("video");
      if (v) (v.paused ? v.play() : v.pause()); else show(current + 1);
    }
    if (e.key === "f") document.documentElement.requestFullscreen?.();
  });

  // Hide the arrows while the mouse is still.
  let idleTimer;
  const wake = () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
  };
  ["mousemove", "touchstart", "keydown"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
  wake();

  // Swipe on phones and tablets.
  let touchX = null;
  document.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    touchX = null;
  });

  const fit = () => {
    const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `scale(${k})`;
  };
  window.addEventListener("resize", fit);
  fit();
  // #3 in the address opens slide 3.
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
